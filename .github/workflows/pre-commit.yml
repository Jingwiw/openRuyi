name: pre-commit

permissions:
  contents: read
on:
  pull_request:
    branches: [main, ci-test]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pre-commit:
    runs-on: [ubuntu-latest]
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
    - uses: actions/setup-python@v6
      with:
        python-version: '3.x'
    - name: Restore pre-commit cache
      uses: actions/cache@v5
      with:
        path: ~/.cache/pre-commit
        key: pre-commit-${{ runner.os }}-${{ env.pythonLocation }}-${{ hashFiles('.pre-commit-config.yaml') }}
    - name: Install pre-commit
      run: |
        set -euo pipefail
        python -m pip install pre-commit
        pre-commit --version
    - name: get changed files
      id: changed-files
      run: |
        set -euo pipefail
        git diff --name-only -z --diff-filter=ACMRT HEAD^1 HEAD > changed-files
        if [ -s changed-files ]; then
          echo "any_changed=true" >> "$GITHUB_OUTPUT"
        else
          echo "any_changed=false" >> "$GITHUB_OUTPUT"
        fi
    - name: Run pre-commit
      if: steps.changed-files.outputs.any_changed == 'true'
      run: |
        set -euo pipefail
        mapfile -d '' files < changed-files
        pre-commit run --show-diff-on-failure --color=always --files "${files[@]}"
