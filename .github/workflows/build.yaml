name: build test

permissions:
  contents: read
  pull-requests: read

on:
  pull_request:
    branches: [main, ci-test]
    paths:
     - 'SPECS/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
    - name: get changed files
      id: changed-files
      run: |
        set -euo pipefail
        git diff --name-only -z --diff-filter=ACMRT HEAD^1 HEAD -- 'SPECS/**' > changed-spec-files

        # pbuild's onlybuild flag works at package granularity; collapse the
        # file list first so multi-file changes do not duplicate work.
        : > changed-packages.raw
        while IFS= read -r -d '' file; do
          case "$file" in
            SPECS/*/*)
              package="${file#SPECS/}"
              package="${package%%/*}"
              printf '%s\0' "$package" >> changed-packages.raw
              ;;
            SPECS/*)
              echo "::error::Cannot map top-level SPECS path to one package: $file"
              exit 1
              ;;
          esac
        done < changed-spec-files
        sort -zu changed-packages.raw > changed-packages

        if [ -s changed-packages ]; then
          echo "specs_any_changed=true" >> "$GITHUB_OUTPUT"
        else
          echo "specs_any_changed=false" >> "$GITHUB_OUTPUT"
        fi
    - name: cache
      id:   cache
      if: steps.changed-files.outputs.specs_any_changed == 'true'
      uses: actions/cache@v5
      with:
        path: |
          SPECS/.pbuild
          SPECS/_build.x86_64
        key: ${{ runner.os }}-pbuild-${{ hashFiles('.github/build/_config', '.github/build/_pbuild', '.github/build/pbuild.patch') }}
        restore-keys: |
          ${{ runner.os }}-pbuild-
    - name: Install tools
      if: steps.changed-files.outputs.specs_any_changed == 'true'
      uses: ./.github/actions/setup-obs-tools
    - name: apply pbuild patch
      if: steps.changed-files.outputs.specs_any_changed == 'true'
      run: |
        set -euo pipefail
        sudo patch --directory=/usr/lib/build --strip=1 -i "$PWD/.github/build/pbuild.patch"
    - name: Limit the number of compilations
      if: steps.changed-files.outputs.specs_any_changed == 'true'
      run: |
        set -euo pipefail
        while IFS= read -r -d '' p; do
          echo "$p"
          echo "BuildFlags: onlybuild:$p" >> ./.github/build/_config
        done < changed-packages
    - name: Build package(s)
      if: steps.changed-files.outputs.specs_any_changed == 'true'
      run: |
        set -euo pipefail
        cp .github/build/* SPECS
        cd SPECS
        if ! sudo pbuild --vm-type=chroot --preset x86_64 --showlog --root=/tmp/b; then
          sudo pbuild --preset x86_64 --result
          exit 1
        fi
    - name: get result
      id: result
      if: steps.changed-files.outputs.specs_any_changed == 'true'
      run: |
        set -euo pipefail
        {
          echo 'paths<<EOF'
          while IFS= read -r -d '' p; do
            echo "SPECS/_build.x86_64/$p"
          done < changed-packages
          echo 'EOF'
        } >> "$GITHUB_OUTPUT"
    - uses: actions/upload-artifact@v7
      if: steps.changed-files.outputs.specs_any_changed == 'true'
      with:
       name: PR${{ github.event.pull_request.number }}-build-packages-results
       path: ${{ steps.result.outputs.paths }}
       if-no-files-found: error
